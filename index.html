<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062a33">
<title>Happy Birthday Sri Lakshmi 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Mulish:wght@400;700;800&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#062a33; --teal:#0f6b6f; --gold:#f6c866; --gold2:#c98f2b; --blush:#ffd9d2; --kum:#d62f50; --ivory:#fff8ec;
  --display:'Rozha One',Georgia,serif; --script:'Caveat','Segoe Script',cursive; --body:'Mulish',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000}
body{font-family:var(--body);color:var(--ivory);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

.stage{position:fixed;inset:0;margin:0 auto;max-width:480px;overflow:hidden;background:var(--deep)}

/* ---------- scenes ---------- */
.scene{position:absolute;inset:0;z-index:1;visibility:hidden;opacity:0;transition:opacity .55s ease,visibility 0s .55s;
  padding:calc(env(safe-area-inset-top,0px) + 56px) 24px calc(env(safe-area-inset-bottom,0px) + 40px);
  display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  background:radial-gradient(90% 55% at 50% 25%,var(--teal) 0,var(--deep) 72%)}
.scene.on{z-index:2;visibility:visible;opacity:1;transition:opacity .55s ease,visibility 0s}

/* masked word reveal */
.w{display:inline-block;overflow:hidden;padding-bottom:.2em;margin-bottom:-.2em;vertical-align:bottom}
.w>span{display:inline-block;transform:translateY(118%)}
.on .w>span{animation:up .85s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d)*.13s + .35s)}
@keyframes up{to{transform:none}}

/* mandala */
.mand{position:absolute;aspect-ratio:1;pointer-events:none}
.mand.c{left:50%;top:50%;width:130%;transform:translate(-50%,-50%)}
.mand svg{position:absolute;inset:0;width:100%;height:100%}
.scene.on .mand svg,.start .mand svg{animation:bloom 1.5s cubic-bezier(.2,.9,.3,1) both,spin 90s linear infinite;
  animation-delay:calc(var(--k)*.2s),calc(var(--k)*.2s + 1.5s)}
.scene.on .mand svg:nth-child(even),.start .mand svg:nth-child(even){animation-name:bloom,spinr}
@keyframes bloom{from{opacity:0;transform:scale(.2) rotate(-90deg)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}

/* ---------- start ---------- */
.start{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px;
  background:radial-gradient(90% 55% at 50% 40%,var(--teal) 0,var(--deep) 75%);transition:opacity .7s,transform .7s,visibility 0s .7s}
.start.gone{opacity:0;transform:scale(1.15);visibility:hidden;pointer-events:none}
.start .mand{opacity:.55}
.start>*:not(.mand){position:relative}
.st1{font:700 2.1rem var(--script);color:var(--blush);animation:fade 1s .4s both}
.st2{font:400 clamp(2.6rem,13vw,3.6rem)/1.05 var(--display);animation:fade 1s .8s both}
.open{margin-top:26px;padding:16px 34px;border-radius:99px;background:var(--gold);color:var(--deep);font-weight:800;font-size:1.08rem;
  animation:fade 1s 1.4s both,glow 1.8s 2.4s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #f6c86688}50%{box-shadow:0 0 0 16px #f6c86600}}

.gold{background:linear-gradient(100deg,var(--gold2) 20%,#fff3c4 45%,var(--gold) 55%,var(--gold2) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.on .w>span.gold{animation:up .85s cubic-bezier(.2,.8,.2,1) forwards,shine 3s linear infinite;animation-delay:calc(var(--d)*.13s + .35s),0s}
.start .gold{animation:shine 3s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}

/* ---------- intro ---------- */
.intro{align-items:center;text-align:center}
.intro>*:not(.mand){position:relative}
.big{font:400 clamp(3.4rem,17vw,5rem)/1 var(--display)}
.nm{font:400 clamp(2.4rem,12vw,3.5rem)/1.1 var(--display);margin-top:14px}
.fav{font:700 2rem var(--script);color:var(--blush);margin-top:16px;opacity:0}
.on .fav{animation:fade 1s 2.2s forwards}
.tw{position:absolute;color:var(--gold);opacity:0}
.on .tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
.skip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;text-align:center;font-size:.9rem;opacity:0;font-weight:700}
.on .skip{animation:fade 1s 3.2s forwards;opacity:.7}

/* ---------- text scene (gold) ---------- */
.text{background:linear-gradient(160deg,#ffd77a,#f0a43a);color:var(--deep)}
.text>*:not(.mand){position:relative}
.text .mand{right:-32%;bottom:-20%;width:115%;opacity:.22}
.lines p{font:400 clamp(2.4rem,11.5vw,3.3rem)/1.05 var(--display);margin-bottom:22px}
.lines p.last{color:var(--kum)}

/* ---------- chips ---------- */
.chips{background:radial-gradient(90% 55% at 50% 20%,#9c2347,#3a0c24 78%)}
.chips h2{font:400 clamp(2.6rem,13vw,3.6rem)/1.05 var(--display);margin-bottom:26px}
.chip{display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;padding:14px 22px;margin-bottom:14px;border-radius:99px;font-weight:800;font-size:clamp(1.15rem,5.4vw,1.5rem);opacity:0;box-shadow:0 8px 20px #0005}
.chip em{font-style:normal;font-size:1.5em}
.chip:nth-of-type(even){margin-left:auto}
.c0{background:var(--gold);color:var(--deep)}
.c1{background:var(--blush);color:#6a1030}
.c2{background:#2fb6aa;color:var(--deep)}
.c3{background:var(--ivory);color:var(--kum)}
.on .chip{animation:pop .75s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--d)*.28s + .8s)}
@keyframes pop{from{opacity:0;transform:rotate(var(--r)) scale(.3) translateY(40px)}to{opacity:1;transform:rotate(var(--r)) scale(1)}}

/* ---------- traits ---------- */
.traits h2{font:400 clamp(2.4rem,12vw,3.3rem)/1.05 var(--display);margin-bottom:28px}
.trait{display:flex;align-items:center;gap:16px;margin-bottom:22px;opacity:0}
.trait b{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--deep);font:400 1.6rem var(--display)}
.trait span{font:700 clamp(1.5rem,7vw,2rem)/1.15 var(--script)}
.on .trait{animation:slidein .8s cubic-bezier(.2,.9,.3,1.1) forwards;animation-delay:calc(var(--d)*.55s + .8s)}
@keyframes slidein{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}

/* ---------- finale ---------- */
.candle{align-items:center;text-align:center;gap:8px}
.finale{align-items:center;justify-content:flex-start;text-align:center;padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
.finale>*:not(.mand){position:relative}
.finale .big{font-size:clamp(2.8rem,14vw,4.2rem)}
.mk{font:700 clamp(2rem,9.5vw,2.6rem)/1.1 var(--script);color:var(--gold);transition:opacity .5s,transform .5s}
.cakewrap{width:min(62vw,250px,34dvh);transition:transform 1.1s cubic-bezier(.2,.9,.3,1)}
.cake{display:block;width:100%;border-radius:24px}
.cake:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
.cake svg{width:100%;height:auto;display:block;overflow:visible}
.flame{transform-origin:120px 70px;animation:flick 1.1s ease-in-out infinite alternate}
.glow{animation:pulse 1.6s ease-in-out infinite alternate}
.ring{fill:none;stroke:var(--gold);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ripple 1.8s ease-out infinite}
@keyframes ripple{from{transform:scale(.6);opacity:.9}to{opacity:0;transform:scale(3.2)}}
@keyframes flick{from{transform:scale(1) rotate(-2deg)}to{transform:scale(.92,1.08) rotate(2.5deg)}}
@keyframes pulse{from{opacity:.5}to{opacity:.95}}
.wish .flame,.wish .glow,.wish .ring{display:none}
.smoke{opacity:0;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.wish .smoke{animation:smoke 2.2s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.candle.wish .cakewrap{animation:hop .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1)}}

.sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;max-height:60dvh;display:flex;flex-direction:column;
  padding:24px 22px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ivory);color:#10323a;border-radius:30px 30px 0 0;
  box-shadow:0 -20px 50px #000a;transform:translateY(106%);transition:transform .9s cubic-bezier(.2,.9,.25,1) .6s}
.stage.fin .sheet{transform:none}
.sheet h3{font:400 clamp(1.5rem,7.4vw,2rem)/1.1 var(--display);color:var(--kum);margin-bottom:10px}
.note{overflow:auto;font-size:1.02rem;line-height:1.6}
.note p{margin-bottom:10px}
.sign{font:700 1.9rem var(--script);color:var(--teal)}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px 12px;border-radius:99px;font-weight:800;font-size:.98rem;text-align:center;text-decoration:none;background:var(--gold);color:var(--deep)}
.btn.ghost{background:transparent;border:2px solid #10323a44;color:#10323a}
.btn:active{transform:scale(.97)}

/* ---------- chrome ---------- */
.bars{position:absolute;z-index:10;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:4px;pointer-events:none}
.bars i{flex:1;height:3px;border-radius:3px;background:#06303d66;overflow:hidden;box-shadow:0 0 0 .5px #fff3}
.bars b{display:block;height:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.mute{position:absolute;z-index:11;right:12px;top:calc(env(safe-area-inset-top,0px) + 22px);width:38px;height:38px;border-radius:50%;background:#06303d88;font-size:1.1rem}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.stage.paused *{animation-play-state:paused!important}
.stage.paused .bars{opacity:.45}

@media (prefers-reduced-motion:reduce){
  .mand svg{animation:none!important}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="bars" id="bars"></div>
  <div id="scenes"></div>
  <aside class="sheet" id="sheet" data-nonav></aside>
  <div class="start" id="start"></div>
</main>

<script>
/* ============ ✏️ EDIT THIS BLOCK ONLY ============ */
const CONFIG = {
  name: "Sri Lakshmi",
  from: "Manjunatha",
  music: "",                // optional, e.g. "song.mp3" placed next to index.html
  lines: ["Another year older.", "Another year wiser.", "Same amazing you."],
  traits: [
    "Your smile that fixes everything",
    "The way you always stand by me",
    "Your laugh that makes any day better"
  ],
  chips: [
    {e:"🌟", t:"Shine brighter"},
    {e:"💪", t:"Win every goal"},
    {e:"😄", t:"Laugh louder"},
    {e:"🪔", t:"Stay blessed"}
  ],
  letter: [
    "You are not just my best friend, you are my biggest support. Thank you for every laugh, every secret and every time you stood by me.",
    "I hope today is full of cake, joy and everything that makes you happy. You deserve all of it and more."
  ],
  story: ["candle","intro","text","traits","chips","finale"]
};
/* ================================================= */

const $ = id => document.getElementById(id);
const stage = $('stage'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = CONFIG.name;

const words = (t, base = 0) => t.split(' ').map((w,i) => `<span class="w" style="--d:${base+i}"><span>${w}</span></span>`).join(' ');

/* Rangoli mandala: 4 rings of petals, each its own svg so CSS can bloom + spin them */
function mandala(color, fillOp = .12){
  const rings = [[8,98],[12,80],[16,62],[24,44]];
  return rings.map(([n,L],k) => {
    const petal = `M0 0C${L*.24} ${-L*.3} ${L*.24} ${-L*.7} 0 ${-L}C${-L*.24} ${-L*.7} ${-L*.24} ${-L*.3} 0 0Z`;
    const ps = Array.from({length:n},(_,i)=>`<path d="${petal}" transform="rotate(${i*360/n})"/>`).join('');
    return `<svg viewBox="-110 -110 220 220" style="--k:${k}" fill="${color}" fill-opacity="${fillOp}" stroke="${color}" stroke-width="1.4">${ps}${k===3?'<circle r="8" fill-opacity=".9"/>':''}</svg>`;
  }).join('');
}

/* ---------- scene templates ---------- */
const T = {
  intro: () => `<section class="scene intro" data-type="intro" data-dur="6500">
    <div class="mand c" style="opacity:.4">${mandala('#f6c866')}</div>
    ${[[14,18,0],[82,24,.8],[10,70,1.4],[86,66,.4],[48,10,1.9],[70,82,1.1]].map(([x,y,d])=>`<i class="tw" style="left:${x}%;top:${y}%;animation-delay:${d}s">✦</i>`).join('')}
    <p class="big">${words('Happy',0)}<br>${words('Birthday',1)}</p>
    <p class="nm"><span class="w" style="--d:4"><span class="gold">${N}</span></span></p>
    <p class="fav">to my favourite person 💛</p>
    <p class="skip">Tap to skip ›</p>
  </section>`,

  text: () => `<section class="scene text" data-type="text" data-dur="6200">
    <div class="mand">${mandala('#062a33',.1)}</div>
    <div class="lines">${CONFIG.lines.map((l,i)=>`<p class="${i===2?'last':''}">${words(l,i*3)}</p>`).join('')}</div>
  </section>`,

  traits: () => `<section class="scene traits" data-type="traits" data-dur="6500">
    <h2>${words('Things I admire',0)}<br>${words('about you',3)}</h2>
    ${CONFIG.traits.map((l,i)=>`<div class="trait" style="--d:${i}"><b>${i+1}</b><span>${l}</span></div>`).join('')}
  </section>`,

  chips: () => `<section class="scene chips" data-type="chips" data-dur="6200">
    <h2>${words('Wishing you',0)}<br>${words('all of this',2)}</h2>
    ${CONFIG.chips.map((c,i)=>`<div class="chip c${i%4}" style="--d:${i};--r:${[-3,2.5,-2,3][i%4]}deg"><em>${c.e}</em>${c.t}</div>`).join('')}
  </section>`,

  candle: () => `<section class="scene candle" data-type="candle" data-dur="hold">
    <div class="mand c" style="opacity:.25">${mandala('#f6c866')}</div>
    <p class="mk" id="mk">Close your eyes, make a wish, then tap the candle</p>
    <div class="cakewrap" data-nonav>
      <button class="cake" id="cake" aria-label="Blow out the candle and make a wish">
        <svg viewBox="0 0 240 270" aria-hidden="true">
          <defs><radialGradient id="g"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#f6c86600"/></radialGradient></defs>
          <circle class="glow" cx="120" cy="50" r="52" fill="url(#g)"/>
          <circle class="ring" cx="120" cy="46" r="14"/>
          <ellipse cx="120" cy="246" rx="112" ry="14" fill="#0006"/>
          <ellipse cx="120" cy="238" rx="108" ry="14" fill="#ffd9d2"/>
          <rect x="28" y="160" width="184" height="76" rx="16" fill="#d62f50"/>
          <path d="M28 176q0-16 16-16h152q16 0 16 16v2q-12 16-24 0t-24 0-24 0-24 0-24 0-24 0-24 0-12 0z" fill="#fff8ec"/>
          <rect x="58" y="112" width="124" height="54" rx="14" fill="#f6c866"/>
          <path d="M58 126q0-14 14-14h96q14 0 14 14v2q-10 14-20 0t-20 0-20 0-20 0-20 0-14 0z" fill="#fff8ec"/>
          <circle cx="60" cy="208" r="5" fill="#f6c866"/><circle cx="96" cy="216" r="5" fill="#fff8ec"/>
          <circle cx="132" cy="208" r="5" fill="#2fb6aa"/><circle cx="168" cy="216" r="5" fill="#f6c866"/>
          <circle cx="86" cy="150" r="4" fill="#d62f50"/><circle cx="154" cy="150" r="4" fill="#d62f50"/>
          <rect x="114" y="68" width="12" height="46" rx="3" fill="#fff8ec"/>
          <path d="M114 80l12-6M114 92l12-6M114 104l12-6" stroke="#0f6b6f" stroke-width="3"/>
          <path class="flame" d="M120 24c10 14 12 22 12 30a12 12 0 0 1-24 0c0-8 2-16 12-30z" fill="#f6b73c"/>
          <path class="flame" d="M120 38c5 8 6 12 6 16a6 6 0 0 1-12 0c0-4 1-8 6-16z" fill="#fff8ec"/>
          <path class="smoke" d="M120 60c-8-10 8-16 0-28"/>
        </svg>
      </button>
    </div>
  </section>`,

  finale: () => `<section class="scene finale" data-type="finale" data-dur="0">
    <div class="mand c" style="opacity:.3;top:34%">${mandala('#f6c866')}</div>
    <p class="big">${words('Happy',0)}<br>${words('Birthday',1)}</p>
    <p class="nm"><span class="w" style="--d:4"><span class="gold">${N}</span></span></p>
  </section>`
};

/* ---------- build ---------- */
const story = CONFIG.story;
$('scenes').innerHTML = story.map(s => { const [k,a] = s.split(':'); return T[k](a); }).join('');
const scenes = [...document.querySelectorAll('.scene')];
$('bars').innerHTML = scenes.map(() => '<i><b></b></i>').join('');
const bars = [...$('bars').children].map(i => i.firstChild);

$('start').innerHTML = `<div class="mand c" style="width:120%">${mandala('#f6c866')}</div>
  <p class="st1">A little surprise for</p>
  <p class="st2 gold">${N}</p>
  <button class="open" id="open">Tap to open ✨</button>`;

$('sheet').innerHTML = `<h3>A note for you 💛</h3>
  <div class="note">${CONFIG.letter.map(p=>`<p>${p}</p>`).join('')}<p class="sign">Your friend, ${CONFIG.from}</p></div>
  <div class="row">
    <a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Thank you for the birthday wishes! 🎂💛 - '+N)}">Say thanks 💛</a>
    <button class="btn ghost" id="replay">Watch again</button>
  </div>`;


/* ---------- optional music ---------- */
let music = null, muted = false;
if (CONFIG.music) {
  music = new Audio(CONFIG.music); music.loop = true; music.volume = .6;
  const b = document.createElement('button');
  b.className = 'mute'; b.textContent = '🔊'; b.setAttribute('data-nonav',''); b.setAttribute('aria-label','Toggle music');
  b.onclick = () => { muted = !muted; music.muted = muted; b.textContent = muted ? '🔇' : '🔊'; };
  stage.appendChild(b);
}

/* ---------- story engine ---------- */
let cur = -1, t = 0, paused = false, started = false, last = performance.now();
function go(i, dir = 1){
  while (scenes[i] && scenes[i].dataset.skip) i += dir;
  if (i >= scenes.length) return;
  if (i < 0) i = 0;
  scenes.forEach(s => s.classList.remove('on'));
  void stage.offsetWidth;                         /* restart CSS animations */
  scenes[i].classList.add('on');
  bars.forEach((b,k) => b.style.transform = `scaleX(${k < i || (k === i && scenes[i].dataset.dur === '0') ? 1 : 0})`);
  cur = i; t = 0;
  const type = scenes[i].dataset.type;
  stage.classList.toggle('fin', type === 'finale');
}
function setPaused(v){ paused = v; stage.classList.toggle('paused', v); }

/* tap left = back, tap right = next, press & hold = pause */
let tracking = false, held = false, holdT = 0;
stage.addEventListener('pointerdown', e => {
  if (!started || e.target.closest('[data-nonav]')) return;
  tracking = true; held = false;
  holdT = setTimeout(() => { held = true; setPaused(true); }, 230);
});
stage.addEventListener('pointerup', e => {
  if (!tracking) return; tracking = false; clearTimeout(holdT);
  if (held) return setPaused(false);
  if (scenes[cur].dataset.type === 'candle' && !wished) return;
  const r = stage.getBoundingClientRect();
  e.clientX < r.left + r.width * .3 ? go(cur-1, -1) : go(cur+1);
});
stage.addEventListener('pointercancel', () => { tracking = false; clearTimeout(holdT); if (held) setPaused(false); });
document.addEventListener('visibilitychange', () => { if (started) setPaused(document.hidden); });

/* ---------- particles: petals, confetti, fireworks (one canvas, one loop) ---------- */
const cv = $('fx'), cx = cv.getContext('2d');
let W = 0, H = 0, fx = [], petals = [], petalsOn = false;
function resize(){ const r = devicePixelRatio || 1; W = stage.clientWidth; H = stage.clientHeight; cv.width = W*r; cv.height = H*r; cx.setTransform(r,0,0,r,0,0); }
resize(); addEventListener('resize', resize);
const PC = ['#f6b73c','#ff8fa3','#ff6f61','#ffe3c8','#ffd24a'];
function makePetals(){ petals = Array.from({length: reduce ? 0 : 22}, (_,i) => ({x:Math.random()*W, y:Math.random()*H, s:5+Math.random()*6, vy:.5+Math.random()*.9, ph:Math.random()*6, r:Math.random()*6, vr:(Math.random()-.5)*.05, c:PC[i%PC.length]})); }
function confetti(n = 150){
  if (reduce) return;
  const C = ['#f6c866','#d62f50','#2fb6aa','#fff8ec','#ff8fa3'];
  for (let i=0;i<n;i++){ const a = Math.random()*6.283, s = 4+Math.random()*9;
    fx.push({k:'c',x:W/2,y:H*.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[i%5],life:150+Math.random()*60}); }
}
function firework(x, y){
  if (reduce) return;
  const c = ['#f6c866','#ff8fa3','#2fb6aa','#fff8ec','#ff6f61'][Math.random()*5|0];
  for (let i=0;i<40;i++){ const a = i/40*6.283, s = 1.6+Math.random()*3;
    fx.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.6+Math.random()*1.6,c,life:75+Math.random()*30,max:105}); }
}
function drawFx(dt){
  const k = dt/16.7;
  cx.clearRect(0,0,W,H);
  if (petalsOn) for (const p of petals){
    p.ph += .02*k; p.y += p.vy*k; p.x += Math.sin(p.ph)*.7*k; p.r += p.vr*k;
    if (p.y > H+20){ p.y = -20; p.x = Math.random()*W; }
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha = .8; cx.fillStyle = p.c;
    cx.beginPath(); cx.ellipse(0,0,p.s,p.s*.55,0,0,6.283); cx.fill(); cx.restore();
  }
  fx = fx.filter(p => p.life > 0 && p.y < H+30);
  for (const p of fx){
    p.life -= k; p.x += p.vx*k; p.y += p.vy*k;
    if (p.k === 'c'){ p.vy += .28*k; p.vx *= .99; p.r += p.vr*k;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.min(1,p.life/40); cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
    } else { p.vy += .05*k; p.vx *= .985; p.vy *= .985;
      cx.globalAlpha = Math.max(0,p.life/p.max); cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill(); cx.globalAlpha = 1; }
  }
}

/* single animation loop: progress bars + particles */
function frame(now){
  const dt = Math.min(now - last, 50); last = now;
  if (started && !paused && cur >= 0){
    const d = scenes[cur].dataset.dur;
    if (+d > 0){ t += dt; bars[cur].style.transform = `scaleX(${Math.min(1,t/+d)})`; if (t >= +d) go(cur+1); }
  }
  if (!document.hidden) drawFx(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- start, finale ---------- */
$('open').addEventListener('click', () => {
  started = true; $('start').classList.add('gone');
  makePetals(); petalsOn = true;
  music && music.play().catch(()=>{});
  navigator.vibrate && navigator.vibrate(30);
  go(0);
});

const candle = scenes.find(s => s.dataset.type === 'candle');
let wished = false;
$('cake').addEventListener('click', () => {
  if (wished) return;
  wished = true;
  candle.classList.add('wish');
  $('mk').textContent = 'Wish made! Happy Birthday 🎉';
  bars[0].style.transform = 'scaleX(1)';
  setTimeout(() => { if (scenes[cur] === candle) go(cur+1); }, 3400);
  confetti(170);
  [0,350,700,1100,1500].forEach((d,i) => setTimeout(() => firework(W*(.2+Math.random()*.6), H*(.12+Math.random()*.22)), d));
  navigator.vibrate && navigator.vibrate([60,40,60]);
});
$('replay').addEventListener('click', () => {
  wished = false; candle.classList.remove('wish');
  $('mk').textContent = 'Close your eyes, make a wish, then tap the candle';
  go(0);
});
</script>
